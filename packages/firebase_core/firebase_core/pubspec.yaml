name: firebase_core
description: Flutter plugin for Firebase Core, enabling connecting to multiple
  Firebase apps.
homepage: https://firebase.google.com/docs/flutter/setup
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_core/firebase_core
version: 4.13.0
resolution: workspace
topics:
  - firebase
  - core

false_secrets:
  - example/**

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  firebase_core_platform_interface: ^8.1.0
  firebase_core_web: ^3.10.0
  flutter:
    sdk: flutter
  meta: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0
  plugin_platform_interface: ^2.1.3

flutter:
  plugin:
    # FORK: Android-only plugin registration. See FORK.md at the repository root.
    # The ios/macos/windows entries are deliberately absent so the Flutter tool
    # never registers this plugin outside Android: no pod is installed, nothing
    # is added to the generated registrants, and no Firebase native SDK is
    # linked into those builds. The native sources under ios/, macos/ and
    # windows/ are left untouched to keep this fork a minimal diff.
    platforms:
      android:
        package: io.flutter.plugins.firebase.core
        pluginClass: FlutterFirebaseCorePlugin
      web:
        default_package: firebase_core_web

firebase:
  google_services_gradle_plugin_version: '4.4.4'
  crashlytics_gradle_plugin_version: '3.0.7'
  performance_gradle_plugin_version: '2.0.2'
