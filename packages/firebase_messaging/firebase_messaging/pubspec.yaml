name: firebase_messaging
description: Flutter plugin for Firebase Cloud Messaging, a cross-platform
  messaging solution that lets you reliably deliver messages on Android and iOS.
homepage: https://firebase.google.com/docs/cloud-messaging
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_messaging/firebase_messaging
version: 16.4.3
resolution: workspace
topics:
  - firebase
  - messaging
  - notifications

false_secrets:
  - example/**

environment:
  sdk: '^3.6.0'
  flutter: '>=3.27.0'

dependencies:
  firebase_core: ^4.12.1
  firebase_core_platform_interface: ^8.0.0
  firebase_messaging_platform_interface: ^4.9.2
  firebase_messaging_web: ^4.2.3
  flutter:
    sdk: flutter
  meta: ^1.8.0

dev_dependencies:
  async: ^2.5.0
  flutter_test:
    sdk: flutter
  mockito: ^5.0.0
  plugin_platform_interface: ^2.1.3

flutter:
  plugin:
    # FORK: Android-only plugin registration. See FORK.md at the repository root.
    # The ios/macos entries are deliberately absent so the Flutter tool never
    # registers this plugin outside Android: no pod is installed, nothing is
    # added to the generated registrants, and no Firebase native SDK is linked
    # into those builds. The native sources under ios/ and macos/ are left
    # untouched to keep this fork a minimal diff.
    platforms:
      android:
        package: io.flutter.plugins.firebase.messaging
        pluginClass: FlutterFirebaseMessagingPlugin
      web:
        default_package: firebase_messaging_web
